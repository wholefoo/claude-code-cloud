[build-system]
requires = ["setuptools>=77"]  # SPDX `license = "..."` strings need 77+
build-backend = "setuptools.build_meta"

[project]
name = "redblue-templates"
version = "0.1.0"
description = "RedBlue template library: server-rendered, accessible, SEO/AEO-ready page types"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["redblue-core", "redblue-cms"]

[tool.setuptools.packages.find]
include = ["redblue.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.yml", "*.yaml", "*.txt", "*.tmpl", "*.jinja", "**/*.html", "**/*.css", "**/*.js", "**/*.tmpl"]
