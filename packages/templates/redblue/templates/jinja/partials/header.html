<header class="rb-header">
  <div class="rb-container rb-header__inner">
    <a class="rb-brand" href="/">{{ site.site_name }}</a>
    <nav aria-label="Main">
      <ul class="rb-nav">
        {% for item in site.nav %}
        <li><a href="{{ item.path }}"{% if page.url == item.path %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <form class="rb-search" action="/search" method="get" role="search">
      <label class="rb-sr" for="rb-q">Search</label>
      <input id="rb-q" name="q" type="search" placeholder="Search" value="{{ page.query or '' }}">
    </form>
    <button class="rb-theme" type="button" data-rb-theme aria-label="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
</header>
