[build-system]
requires = ["setuptools>=77"]  # SPDX `license = "..."` strings need 77+
build-backend = "setuptools.build_meta"

[project]
name = "redblue-platform"
version = "0.1.0"
description = "RedBlue platform app: composes core, CMS, templates, growth, observability and admin"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["redblue-core", "redblue-cms", "redblue-templates", "redblue-growth", "redblue-observe", "redblue-admin", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["redblue.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.yml", "*.yaml", "*.txt", "*.tmpl", "*.jinja", "**/*.html", "**/*.css", "**/*.js", "**/*.tmpl"]
