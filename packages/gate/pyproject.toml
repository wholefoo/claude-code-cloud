[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redblue-gate"
version = "0.1.0"
description = "RedBlue security gate: Red/Blue agents, scanners, release gate"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
scanners = ["bandit>=1.7", "pip-audit>=2.7", "semgrep>=1.70"]

[project.scripts]
redblue-gate = "redblue.gate.cli:main"

[tool.setuptools.packages.find]
include = ["redblue.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.yml", "*.yaml", "*.txt", "*.tmpl", "*.jinja", "**/*.html", "**/*.css", "**/*.js", "**/*.tmpl"]
