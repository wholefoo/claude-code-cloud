[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redblue-builder"
version = "0.1.0"
description = "RedBlue builder agent: intent to ejectable FastAPI app"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["redblue-core", "redblue-templates", "redblue-gate", "jinja2>=3.1"]

[tool.setuptools.packages.find]
include = ["redblue.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.yml", "*.yaml", "*.txt", "*.tmpl", "*.jinja", "**/*.html", "**/*.css", "**/*.js", "**/*.tmpl"]
