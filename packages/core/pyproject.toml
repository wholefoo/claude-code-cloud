[build-system]
requires = ["setuptools>=77"]  # SPDX `license = "..."` strings need 77+
build-backend = "setuptools.build_meta"

[project]
name = "redblue-core"
version = "0.1.0"
description = "RedBlue backend SDK: data, auth, storage, jobs, email, AI, webhooks, secure defaults"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "starlette>=0.40", "sqlalchemy>=2.0", "alembic>=1.13", "pydantic>=2.7", "pydantic-settings>=2.3", "itsdangerous>=2.1", "argon2-cffi>=23.1", "python-multipart>=0.0.9", "jinja2>=3.1", "httpx>=0.27"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["redblue.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.yml", "*.yaml", "*.txt", "*.tmpl", "*.jinja", "*.mako", "**/*.html", "**/*.css", "**/*.js", "**/*.tmpl"]
