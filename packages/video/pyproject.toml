[build-system]
requires = ["setuptools>=77"]  # SPDX `license = "..."` strings need 77+
build-backend = "setuptools.build_meta"

[project]
name = "redblue-video"
version = "0.1.0"
description = "RedBlue video: trend detection, cited scripts, licensed assets and FFmpeg rendering"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["redblue-core", "redblue-admin", "httpx>=0.27", "imageio-ffmpeg>=0.5", "defusedxml>=0.7"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[tool.setuptools.packages.find]
include = ["redblue.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["**/*.html"]
