[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redblue-observe"
version = "0.1.0"
description = "RedBlue observability: structured logs, metrics, error tracking, ops agent"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["redblue-core"]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-instrumentation-fastapi>=0.46b0"]

[tool.setuptools.packages.find]
include = ["redblue.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.yml", "*.yaml", "*.txt", "*.tmpl", "*.jinja", "**/*.html", "**/*.css", "**/*.js", "**/*.tmpl"]
