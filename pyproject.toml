# Workspace-level tooling config. Each package under packages/ (and admin/)
# is its own distribution; install them all for development with:
#   pip install -e packages/core -e packages/cms ... (see Makefile: `make dev`)
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/vulnerable-demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["redblue"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"evals/**" = ["S"]
# ASS subtitle headers are a fixed-width file format.
"packages/video/redblue/video/render.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["packages", "admin", "evals"]
addopts = "-q --import-mode=importlib"
norecursedirs = ["project_template", ".*", "*.egg-info", "node_modules"]
filterwarnings = ["ignore::DeprecationWarning"]
