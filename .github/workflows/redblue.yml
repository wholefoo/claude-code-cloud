# Dogfood: RedBlue gates its own pull requests. Plain pull_request only.
name: RedBlue gate
on: pull_request
permissions:
  contents: write
  pull-requests: write
  security-events: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - uses: ./action
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          config: .redblue.yml
          install: make dev  # the monorepo's packages, so the preview app can start
