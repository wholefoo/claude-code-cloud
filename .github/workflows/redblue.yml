# Dogfood: RedBlue gates its own pull requests. Plain pull_request only.
name: RedBlue gate
on: pull_request
permissions:
  contents: write
  pull-requests: write
  security-events: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./action
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          config: .redblue.yml
