name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: make dev
      - run: ruff check .
      - run: pytest
      - name: Gate evals (no AI)
        run: python evals/gate/run_eval.py --no-ai --max-fp-rate 0.1 --min-recall 0.9

  admin-screens:
    # Real-browser check of every admin page at desktop and phone widths; the screenshots
    # are kept as a build artifact so a person can look at them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: make dev
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: pytest packages/platform/tests/test_admin_screens.py
        env:
          RB_SCREENSHOT_DIR: ${{ github.workspace }}/admin-screenshots
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: admin-screenshots
          path: admin-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    # Migrations against a real Postgres: fresh upgrade matches the models, databases from
    # before migrations are brought up to date, failures roll back, concurrent starts are safe.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI container: no password in the repo
          POSTGRES_DB: redblue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: make dev
      - run: pip install "psycopg[binary]>=3.1"
      - run: pytest -rs packages/core/tests/test_migrations_postgres.py
        env:
          RB_TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/redblue_test
