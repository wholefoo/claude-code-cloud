name: RedBlue security gate
description: >-
  Adversarially test every pull request: scan the code and a preview of the app the action
  launches itself, then propose verified fixes with regression tests as pull requests.
author: RedBlue contributors
branding:
  icon: shield
  color: red

inputs:
  anthropic_api_key:
    description: >-
      Your own Claude API key (bring your own key). Optional: without it the gate runs all
      scanners with deterministic triage and fixers only. Fork PRs never receive it.
    required: false
    default: ""
  config:
    description: Path to the gate config file.
    required: false
    default: .redblue.yml
  fail_on:
    description: Severity threshold that fails the check (info, low, medium, high, critical).
    required: false
    default: ""
  open_fix_prs:
    description: Open pull requests for verified fixes. PRs are never merged automatically.
    required: false
    default: "true"
  upload_sarif:
    description: Upload results to GitHub code scanning (needs security-events write).
    required: false
    default: "true"
  install:
    description: >-
      Command that installs your app so the gate can launch a preview of it (e.g.
      "make dev" or "pip install -e ./backend"). Without it the gate installs
      requirements.txt or the root pyproject.toml if present; if the app still can't be
      imported, the preview and DAST are skipped and the report says so.
    required: false
    default: ""
  dast_tools:
    description: >-
      Also run OWASP ZAP (baseline scan, from a pinned Docker image) and Nuclei (pinned
      release and templates) against the preview. The preview then runs as a server on
      127.0.0.1. Linux x64 runners with Docker only; adds a few minutes per run. ZAP uses
      the host network and its own API listens without a key during the scan, so use it
      on self-hosted runners only if they accept no inbound connections.
    required: false
    default: "false"
  python_version:
    description: Python version used to run the app under test.
    required: false
    default: "3.12"

outputs:
  passed:
    description: '"true" when the gate passed.'
    value: ${{ steps.gate.outputs.passed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install RedBlue gate
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.action_path }}/../packages/gate[ai,scanners]"
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then python -m pip install -e . || true; fi

    - name: Install ZAP and Nuclei
      if: inputs.dast_tools == 'true' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        NUCLEI_VERSION: "3.11.1"
        NUCLEI_SHA256: ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6
        NUCLEI_TEMPLATES: v10.4.9
        ZAP_IMAGE: zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/redblue-bin"
        mkdir -p "$bin"
        zip="$RUNNER_TEMP/nuclei.zip"
        curl -sSfL -o "$zip" "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
        echo "${NUCLEI_SHA256}  $zip" | sha256sum -c -
        unzip -o -q "$zip" nuclei -d "$bin"
        git clone -q --depth 1 --branch "$NUCLEI_TEMPLATES" \
          https://github.com/projectdiscovery/nuclei-templates.git "$HOME/nuclei-templates"
        echo "$bin" >> "$GITHUB_PATH"
        docker pull -q "$ZAP_IMAGE"
        echo "REDBLUE_ZAP_IMAGE=$ZAP_IMAGE" >> "$GITHUB_ENV"

    - name: Install the app
      if: inputs.install != ''
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}  # via env, never interpolated into the script
      run: bash -c "$INSTALL"

    - name: Run gate
      id: gate
      shell: bash
      env:
        # Only present for same-repo PRs: plain `pull_request` events from forks get no
        # secrets, and the gate additionally skips AI steps when it detects a fork.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set +e
        args=(ci --config "${{ inputs.config }}" --open-fix-prs "${{ inputs.open_fix_prs }}")
        if [ -n "${{ inputs.fail_on }}" ]; then args+=(--fail-on "${{ inputs.fail_on }}"); fi
        redblue-gate "${args[@]}"
        code=$?
        if [ $code -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: always() && inputs.upload_sarif == 'true' && hashFiles('redblue.sarif') != ''
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      continue-on-error: true
      with:
        sarif_file: redblue.sarif
        category: redblue

    - name: Comment on pull request
      if: always() && github.event_name == 'pull_request' && hashFiles('redblue-report.md') != ''
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr comment "${{ github.event.pull_request.number }}" --body-file redblue-report.md --edit-last || gh pr comment "${{ github.event.pull_request.number }}" --body-file redblue-report.md

    - name: Enforce gate
      shell: bash
      run: exit ${{ steps.gate.outputs.code }}
