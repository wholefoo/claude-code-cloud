# Known-safe code: any finding at medium or above counts as a false positive.
- name: parameterised-sql
  file: app.py
  code: |
    def search(db, q):
        return db.execute("SELECT * FROM products WHERE name = ?", (q,)).fetchall()
- name: sqlalchemy-bound
  file: app.py
  code: |
    from sqlalchemy import text
    def get(session, uid):
        return session.execute(text("SELECT * FROM users WHERE id = :id"), {"id": uid})
- name: subprocess-list
  file: app.py
  code: |
    import subprocess
    def ping(host):
        subprocess.run(["ping", "-c", "1", host], check=True)
- name: yaml-safe
  file: app.py
  code: |
    import yaml
    def parse(body):
        return yaml.safe_load(body)
- name: escaped-html
  file: app.py
  code: |
    from html import escape
    from fastapi import FastAPI
    from fastapi.responses import HTMLResponse
    app = FastAPI()
    @app.get("/hello")
    def hello(name: str):
        return HTMLResponse(f"<h1>Hello {escape(name)}</h1>")
- name: safe-redirect
  file: app.py
  code: |
    from fastapi import FastAPI
    from fastapi.responses import RedirectResponse
    app = FastAPI()
    @app.get("/done")
    def done():
        return RedirectResponse("/dashboard")
