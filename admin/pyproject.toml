[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redblue-admin"
version = "0.1.0"
description = "RedBlue admin UI (FastAPI + HTMX)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["redblue-core", "redblue-cms", "redblue-templates", "redblue-growth", "redblue-observe"]

[tool.setuptools.packages.find]
include = ["redblue.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["**/*.html", "**/*.css", "**/*.js"]
