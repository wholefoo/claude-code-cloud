# One-command deploy on any VPS:
#   cp deploy/compose/.env.example deploy/compose/.env   # then edit it
#   docker compose -f deploy/compose/docker-compose.yml up -d
#   docker compose -f deploy/compose/docker-compose.yml exec web redblue createadmin you@example.com
name: redblue
services:
  web:
    build: { context: ../.., dockerfile: deploy/Dockerfile }
    env_file: .env
    environment:
      RB_DATABASE_URL: postgresql+psycopg://redblue:${POSTGRES_PASSWORD}@db:5432/redblue
      RB_STORAGE_DIR: /srv/site/media
    volumes: [media:/srv/site/media]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  worker:
    build: { context: ../.., dockerfile: deploy/Dockerfile }
    command: ["redblue", "worker"]
    env_file: .env
    environment:
      RB_DATABASE_URL: postgresql+psycopg://redblue:${POSTGRES_PASSWORD}@db:5432/redblue
      RB_STORAGE_DIR: /srv/site/media
    volumes: [media:/srv/site/media]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redblue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: redblue
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U redblue"], interval: 5s, retries: 10 }
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { SITE_DOMAIN: "${SITE_DOMAIN}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    depends_on: [web]
    restart: unless-stopped
volumes: { media: {}, pgdata: {}, caddy_data: {} }
