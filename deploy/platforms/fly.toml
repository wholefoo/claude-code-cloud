# fly launch --copy-config --dockerfile deploy/Dockerfile
# fly secrets set RB_SECRET_KEY=... RB_DATABASE_URL=... (use `fly postgres create`)
app = "my-redblue-site"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  RB_ENV = "prod"
  RB_STORAGE_DIR = "/data/media"

[mounts]
  source = "redblue_media"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/_rb/health"
    timeout = "5s"

[processes]
  web = "uvicorn redblue.platform.app:app --host 0.0.0.0 --port 8000 --proxy-headers"
  worker = "redblue worker"
